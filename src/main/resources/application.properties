spring.application.name=mypet

# Banco de dados H2 salvo em arquivo local
spring.datasource.url=jdbc:h2:file:./data/mypetdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Criação automática das tabelas pelo Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Habilita o painel visual /h2-console no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console